<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Jupiter Run</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231F20;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
        outline: none;
      }
      #unity-footer {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.setAttribute("tabindex", "0");
      canvas.focus();

      var gameKeys = {
        ArrowLeft: true,
        ArrowRight: true,
        ArrowUp: true,
        ArrowDown: true,
        " ": true,
        a: true,
        A: true,
        d: true,
        D: true,
        w: true,
        W: true,
      };

      function focusCanvas() {
        canvas.focus();
      }

      window.addEventListener("pointerdown", focusCanvas);
      window.addEventListener("click", focusCanvas);
      window.addEventListener("focus", focusCanvas);
      window.addEventListener(
        "keydown",
        function (event) {
          if (gameKeys[event.key]) event.preventDefault();
          if (document.activeElement !== canvas) canvas.focus();
        },
        true,
      );

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game-build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/game-build.data",
        frameworkUrl: buildUrl + "/game-build.framework.js",
        codeUrl: buildUrl + "/game-build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Jupiter Run",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
